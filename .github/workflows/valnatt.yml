name: Valnatt – hämta, bygg, deploya
on:
  schedule:
    - cron: "*/5 18-23 * * 0"   # 20:00–01:00 svensk tid, valdagen (söndag 13/9)
    - cron: "*/5 0-1 * * 1"     # efter midnatt (måndag, UTC)
  workflow_dispatch:            # kör manuellt för test
permissions:
  contents: read
concurrency:
  group: valnatt
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Hämta alla tre valen, bygg och deploya
        run: python3 hamta.py --deploy --live
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
