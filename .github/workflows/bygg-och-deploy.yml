name: Deploy till Netlify
on:
  push:
    branches: [ main ]
    paths: [ "public/**" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploya färdigbyggd public/ till Netlify
        run: npx --yes netlify-cli@17 deploy --dir=public --prod --message "Deploy ${GITHUB_SHA}"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
