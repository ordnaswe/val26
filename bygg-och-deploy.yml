name: Bygg och deploy valdistrikt-sajt

on:
  workflow_dispatch:            # kan koras manuellt fran Actions-fliken
  push:
    branches: [ main ]          # bygg om nar du andrar kod eller data
  # Kontinuerlig valnatts-cron laggs till NAR hamtar-loopen finns (nasta steg).
  # schedule:
  #   - cron: "*/2 * * * *"     # exempel: varannan minut (UTC)

concurrency:
  group: bygg-deploy
  cancel-in-progress: false

jobs:
  bygg-och-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Satt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bygg public/index.html
        run: |
          if [ -f data/distrikt.csv ]; then
            python3 build.py \
              --districts data/distrikt.csv \
              $( [ -f data/scb.csv ]            && echo --covariates data/scb.csv ) \
              $( [ -f data/historik.csv ]       && echo --history    data/historik.csv ) \
              $( [ -f data/valdistrikt.geojson ] && echo --geojson    data/valdistrikt.geojson ) \
              --status "$(cat data/status.txt 2>/dev/null || echo '')" \
              --out public/index.html
          else
            echo "Ingen data/distrikt.csv hittad - bygger med syntetiskt exempeldata."
            python3 build.py --out public/index.html
          fi

      - name: Deploya public/ till Netlify
        run: npx --yes netlify-cli@17 deploy --prod --dir=public --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
