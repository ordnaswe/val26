name: Valnatt - hamta och deploy

on:
  workflow_dispatch:
  schedule:
    # GitHub cron kor i UTC och ar grov (minst ~5 min, ofta fordrojd/hoppad
    # under hog last). Valnatten 13 sep 2026 ar sommartid: 18:00 UTC = 20:00
    # svensk tid, da vallokalerna stanger och rakningen borjar.
    # For minutsnabb drift: kor hamta.py i en loop pa en VPS i stallet (se STEG.md).
    - cron: "*/5 18-23 * * 0"    # var 5:e min, kl 20-01 svensk tid, sondag
    - cron: "*/5 0-2  * * 1"     # natten mot mandag

concurrency:
  group: valnatt
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Satt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Beständig cache mellan korningar sa endast andrade zip laddas ner.
      - name: Aterstall cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: valnatt-cache-${{ github.run_id }}
          restore-keys: |
            valnatt-cache-

      - name: Hamta, bygg (bygger bara om nagot andrats)
        # preliminar_00_RD = riksdagens preliminara zip. For kommunval: --pattern "_KF"
        run: python3 hamta.py --pattern preliminar_00_RD --live --out public/index.html

      - name: Deploya public/ till Netlify
        if: hashFiles('public/index.html') != ''
        run: npx --yes netlify-cli@17 deploy --prod --dir=public --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
